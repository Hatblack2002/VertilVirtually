// VERTIL Control — app simple de control (directiva Fase B, requisito 5).
// Se clona PRIMERO en el espacio virtual: si el clon de esta app funciona y el juego no,
// el problema es específico del juego (splits/obb/anti-cheat), no del motor.
// Cero dependencias, cero recursos: mínima superficie de build.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vertil.controlapp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vertil.controlapp'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
