// VERTIL — engine (RECOVERED de VirtualApp2022 lib/, modernizado FASE A paso 5)
// Cambios clave vs original:
//  - AGP 8.x: namespace en Gradle (el atributo package se retira del manifest)
//  - externalNativeBuild ndkBuild REACTIVADO (estaba comentado L24-28 del original), APP_PLATFORM 24
//  - compileSdk 34 / minSdk 24 / targetSdk 28 (host) según ARCHITECTURE_RECONSTRUCTION §5
//  - Dependencias jitpack/jcenter eliminadas; solo Google + Maven Central
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.lody.virtual'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0-vertil'
        externalNativeBuild {
            ndkBuild {
                abiFilters 'arm64-v8a', 'x86_64'
                arguments 'APP_PLATFORM=android-24'
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    buildFeatures {
        // AGP 8 desactiva AIDL por defecto (AGP 8.0 release notes); el motor define
        // sus interfaces binder en src/main/aidl (IVClient, IServiceConnection,
        // IIntentReceiver, IJobCallback, ...). Sin esto: 100 errores javac
        // "cannot find symbol" / "package ... does not exist" (run 42126044480).
        aidl true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // IJobService need NewApi (heredado del original)
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Sustituye a me.weishu:free_reflection 3.0.1 (VirtualCore.startup) — INTEGRATED, Apache-2.0
    // 6.2 downgrade a 6.1: el AAR 6.2 declara minCompileSdk=37 (verificado en sus
    // aar-metadata.properties) y la rama está clavada en compileSdk 34 (FASE A paso 5);
    // 6.1 no declara restricción. Único uso: HiddenApiBypass.addHiddenApiExemptions("L"),
    // API núcleo presente en 6.1. (run 42127337046: checkReleaseAarMetadata FAILED)
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    compileOnly 'androidx.annotation:annotation:1.8.2'
}
