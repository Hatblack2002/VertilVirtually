// VERTIL host (:app) — FASE B. UI de prueba sobre la API pública del motor.
// Java puro + vistas del framework (sin appcompat/Compose) para minimizar el build;
// la UI final Compose queda para Fase C (decisión ARCHITECTURE_RECONSTRUCTION §2 revisada).
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vertil.virtualapp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vertil.virtualapp'
        minSdk 24
        targetSdk 28
        versionCode 13
        versionName '0.1.12-faseB'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        // (VERTIL 0.1.11) El motor de 2022 asume libva++.so EXTRAÍDA en nativeLibraryDir:
        // NativeEngine.enableIORedirect comprueba esa ruta para arrancar la inyección
        // nativa (IOUniformer::startUniformer → LD_PRELOAD). AGP 8 empaqueta por defecto
        // con extractNativeLibs=false y la comprobación fallaba ("io redirect failed"
        // en el logcat del propietario), dejando el clón SIN redirección de E/S del
        // espacio virtual (riesgo de que el clón lea/escriba rutas reales).
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':engine')
}
